version: 2

builds:
  - id: linux
    main: ./cmd/ssh-agent-crypt
    goos: [linux]
    goarch: [amd64]
    flags: [-trimpath]
    ldflags: [-s -w]
  - id: windows
    main: ./cmd/ssh-agent-crypt
    goos: [windows]
    goarch: [amd64]
    flags: [-trimpath]
    ldflags: [-s -w]
    hooks:
      post: .gh-actions/sign-binaries/sign {{ .Path }}

archives:
  - formats: [binary]
    name_template: '{{ .ProjectName }}-{{ .Os }}-{{ .Arch }}'

checksum:
  name_template: SHA256SUMS

changelog:
  filters:
    exclude:
      - '^v[0-9]+\.[0-9]+\.[0-9]+$'
